name: Cabal CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: haskell-actions/setup@v2
        name: Setup Haskell
        with:
          ghc-version: latest
          cabal-version: latest

      - name: Build
        run: cabal build all

      - name: Test
        run: cabal test all --test-show-details=direct
